# n8n, SQLite (D007), behind the host's Caddy (D003).
# Values come from .env next to this file (see .env.example). Never commit .env.
name: kai-hausmeister

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?set N8N_VERSION in .env}
    restart: unless-stopped
    ports:
      # localhost only: Caddy on the host terminates HTTPS and proxies here.
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: ${N8N_HOST:?set N8N_HOST in .env}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_PROXY_HOPS: "1"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      GENERIC_TIMEZONE: ${TZ:-UTC}
      TZ: ${TZ:-UTC}
      # SQLite is the default DB; data lives in the volume below.
      DB_TYPE: sqlite
      # Keep run history small (SQLite grows otherwise).
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"          # hours = 14 days
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "5000"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      # Code node may use only the crypto module (webhook signature check, F05).
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      # Named volume only, no host paths: n8n cannot see other apps on the server (R10).
      - n8n_data:/home/node/.n8n
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  n8n_data:
